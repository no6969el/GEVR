name: Crash report
description: The game closed, froze, or hard-crashed
title: "[Crash] "
labels: ["crash", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry it crashed - reports like this help a lot. **Please do not attach ROM files.**

        Play the current zip: https://github.com/no6969el/GEVR/releases/latest (vr442).

        If `goldeneye.exe` died hard, look beside it for `gevr-fault-*.txt` and paste the first lines below.

  - type: input
    id: headset_model
    attributes:
      label: Headset model
      description: Which headset were you using? (or "none" if monitor only)
      placeholder: Pimax Crystal Super
    validations:
      required: true

  - type: dropdown
    id: openxr_runtime
    attributes:
      label: OpenXR runtime
      options:
        - SteamVR
        - PimaxXR (native Pimax)
        - Virtual Desktop (VDXR)
        - Other (say which below)
        - Not sure / not using VR
    validations:
      required: true

  - type: dropdown
    id: steamvr_running
    attributes:
      label: Is SteamVR running?
      options:
        - Yes
        - No
        - Not installed
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: display_target
    attributes:
      label: Where was the picture right before the crash?
      options:
        - In the headset (HMD)
        - Flat on the monitor only
        - Black screen / no image
        - Never got a picture
    validations:
      required: true

  - type: dropdown
    id: start_gevr_bat
    attributes:
      label: Did you start with Start-GEVR.bat?
      description: No headset? Use Play-on-monitor.bat and pick No.
      options:
        - Yes
        - No
        - Not sure
    validations:
      required: true

  - type: input
    id: build_tag
    attributes:
      label: Build or Release tag
      description: Optional (e.g. vr442).
      placeholder: vr442
    validations:
      required: false

  - type: input
    id: boot_cmd
    attributes:
      label: Boot script filename
      description: The `gevr-*-boot.cmd` file next to Start-GEVR.bat (e.g. gevr-vr442-boot.cmd).
      placeholder: gevr-vr442-boot.cmd
    validations:
      required: false

  - type: textarea
    id: repro_steps
    attributes:
      label: What were you doing right before it crashed?
      description: Short steps or one paragraph is fine.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: e.g. keep playing, return to menu, etc.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Freeze, instant close, Windows error, etc.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time with the same steps
        - Sometimes
        - Only happened once
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: fault_file
    attributes:
      label: Fault file (gevr-fault-*.txt)
      description: Optional - if a `gevr-fault-*.txt` appeared beside goldeneye.exe, paste the first lines. No ROM files.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: On-screen message, Windows error, or log lines
      description: Optional - no ROM files.
    validations:
      required: false
